        input { padding: 8px; width: 100%; margin-bottom: 10px; box-sizing: border-box; }

        <button onclick="saveSettings()">Saqlash</button>
    </div>

    <script>
        function saveSettings() {
            // Backend admin API ga ulash uchun joy (keyingi qadamda yoziladi)
            alert("Sozlamalar saqlandi! (Ma'lumotlar bazasida yangilandi)");

</html>
