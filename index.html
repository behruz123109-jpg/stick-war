<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stick War: Online</title>
    <style>
        body { margin: 0; background-color: #1a1a2e; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        #ui-bar { display: flex; justify-content: space-between; width: 800px; padding: 10px; background: #16213e; border-radius: 8px; margin-bottom: 10px; }
        .btn { padding: 10px 15px; cursor: pointer; border: none; border-radius: 5px; font-weight: bold; transition: 0.2s; }
        .btn-spawn { background: #e94560; color: white; }
        .btn-spawn:hover { background: #d93852; }
        .btn-ad { background: #f39c12; color: white; animation: pulse 2s infinite; }
        canvas { background-color: #e0e0e0; border: 4px solid #0f3460; border-radius: 8px; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

    <div id="ui-bar">
        <div>
            <span>O'yinchi: <b id="playerName">Mehmon</b></span> | 
            <span>Olmos: <b id="gemCount" style="color: #00d2ff;">0</b> 💎</span>
        </div>
        <div>
            <button class="btn btn-ad" onclick="watchAd()">🎥 Reklama ko'rish (+10 💎)</button>
            <button class="btn btn-spawn" onclick="spawnUnit()">⚔️ Askar (100 Oltin)</button>
        </div>
    </div>

    <canvas id="gameCanvas" width="800" height="400"></canvas>

    <script>
        // --- 1. SOZLAMALAR VA MULTIPLAYER ---
        const username = "Player_" + Math.floor(Math.random() * 1000);
        document.getElementById("playerName").innerText = username;
        
        const ws = new WebSocket(`ws://${window.location.host}/ws/Lobby-1`);
        let units = [];

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            if (data.action === "spawn") {
                units.push({ x: data.x, y: data.y, color: data.color, isEnemy: data.owner !== username });
            }
        };

        function spawnUnit() {
            const unitData = { action: "spawn", owner: username, x: 50, y: 300, color: "#0f3460" };
            ws.send(JSON.stringify(unitData));
        }

        // --- 2. O'YIN DVIJOKI (Game Loop) ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Yer chizish
            ctx.fillStyle = "#8d6e63";
            ctx.fillRect(0, 340, canvas.width, 60);

            // Askarlarni chizish va yurgizish
            units.forEach((unit) => {
                ctx.fillStyle = unit.isEnemy ? "#e94560" : unit.color;
                ctx.fillRect(unit.x, unit.y, 20, 40);
                
                // Oddiy AI: Askarlar o'ngga yoki chapga yuradi
                if(unit.isEnemy) {
                    unit.x -= 1.5; // Dushman chapga
                } else {
                    unit.x += 1.5; // Bizniki o'ngga
                }
            });

            requestAnimationFrame(gameLoop);
        }
        gameLoop();

        // --- 3. REKLAMA VA MONETIZATSIYA ---
        async function watchAd() {
            // Haqiqiy loyihada bu yerda Yandex yoki Poki Ad API chaqiriladi
            alert("Reklama ko'rsatilmoqda... (Mock API)");
            
            // Backendga xabar berish va olmos olish
            const response = await fetch(`/api/reward/${username}`, { method: 'POST' });
            const result = await response.json();
            
            if(result.status === "success") {
                let currentGems = parseInt(document.getElementById("gemCount").innerText);
                document.getElementById("gemCount").innerText = currentGems + 10;
                alert(result.message);
            }
        }
    </script>
</body>
</html>
